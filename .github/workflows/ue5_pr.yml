name: UE5-PR

on:
  pull_request:
    branches:
      - ue5-dev
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ubuntu-pr:
    name: Ubuntu PR
    # The self-hosted GPU runner only exists upstream; the youtalk fork runs PR
    # CI on Ubicloud via ubicloud_pr.yml, so skip this job on the fork.
    if: ${{ github.repository == 'carla-simulator/carla' }}
    uses: ./.github/workflows/_ci-ubuntu.yml
    with:
      python-versions: "3.10"
      smoke-test-python-versions: "3.10"
      additional-maps: false
      upload-package: false
      upload-replace-latest: false
      upload-docker: false

