name: Ubicloud CI

on:
  workflow_call:
    inputs:
      ubuntu-version:
        type: string
        required: false
        default: "22.04"

jobs:
  build:
    name: Build (Ubuntu ${{ inputs.ubuntu-version }})
    runs-on: ubicloud-standard-30
    container:
      image: ghcr.io/${{ github.repository_owner }}/carla-ue5-toolchain:${{ inputs.ubuntu-version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARLA_UNREAL_ENGINE_PATH: /unreal-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug toolchain
        if: always()
        run: |
          echo "=== RHEL compat symlinks ==="
          ls -la /lib64/libm* 2>/dev/null || echo "no /lib64/libm*"
          ls -la /usr/lib64/libm* 2>/dev/null || echo "no /usr/lib64/libm*"
          echo "=== Ubuntu system libs ==="
          ls -la /lib/x86_64-linux-gnu/libm* 2>/dev/null || echo "no Ubuntu libm"
          echo "=== UE5 Clang test ==="
          CLANG=$(ls ${CARLA_UNREAL_ENGINE_PATH}/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux/Linux_x64/v*/x86_64-unknown-linux-gnu/bin/clang 2>/dev/null | head -1)
          echo "Clang: $CLANG"
          echo 'int main(){return 0;}' > /tmp/test.c
          $CLANG -v /tmp/test.c -lm -o /tmp/test 2>&1 || true
          echo "=== Clang default search paths ==="
          $CLANG -print-search-dirs 2>&1 | head -5

      - name: Configure
        run: |
          cmake --preset Release \
            -DENABLE_ROS2=ON \
            -DBUILD_CARLA_UNREAL=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build LibCarla Client
        run: cmake --build Build/Release --target carla-client

      - name: Build LibCarla Server
        run: cmake --build Build/Release --target carla-server

      - name: Build PythonAPI
        run: cmake --build Build/Release --target carla-python-api

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary (Ubuntu ${{ inputs.ubuntu-version }})" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: ubicloud-standard-30" >> $GITHUB_STEP_SUMMARY
          echo "- Container: carla-ue5-toolchain:${{ inputs.ubuntu-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Targets: carla-client, carla-server, carla-python-api" >> $GITHUB_STEP_SUMMARY
