name: UE5-Dev

on:
  push:
     branches:
       - ue5-dev
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-dev:
    name: Ubuntu Dev
    # The self-hosted GPU runner only exists upstream; the youtalk fork runs dev
    # CI on Ubicloud via ubicloud_dev.yml, so skip this job on the fork.
    if: ${{ github.repository == 'carla-simulator/carla' }}
    uses: ./.github/workflows/_ci-ubuntu.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
    with:
      python-versions: "3.10"
      smoke-test-python-versions: "3.10"
      additional-maps: false
      upload-package: true
      upload-replace-latest: true
      upload-docker: false

